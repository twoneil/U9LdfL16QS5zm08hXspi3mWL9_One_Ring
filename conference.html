<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conference — Kitco Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="lockup">
      <span class="kitco">KITCO</span>
      <span class="media-badge">MEDIA</span>
    </div>
    <div class="util-row">
      <a class="util-btn util-home" href="index.html" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2V20h-6v-6h-4v6H4Z" fill="#fff"/></svg>
      </a>
      <a class="util-btn util-help" href="help.html" aria-label="Help">?</a>
    </div>
  </div>

  <div class="page-head">
    <div class="page-icon bg-black">
      <svg viewBox="0 0 24 24">
        <defs><linearGradient id="pg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8E3FAE"/><stop offset="1" stop-color="#E2645B"/></linearGradient></defs>
        <path d="M3 5h11v7H9l-3.2 3V12H3Z" fill="url(#pg1)"/>
        <path d="M11 10h10v7h-2.8v3L15 17h-4Z" fill="url(#pg1)" opacity="0.85"/>
      </svg>
    </div>
    <h1>Conference</h1>
  </div>

  <div class="grid">

    <a class="tile-link" href="#">
      <div class="tile bg-black">
        <svg viewBox="0 0 24 24">
          <path d="M12 3l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.9 6.8 19l1-5.8-4.2-4.1 5.8-.8z" fill="#F0C24D"/>
        </svg>
      </div>
      <span class="tile-label">Master of<br>conferences</span>
    </a>

    <a class="tile-link" href="#">
      <div class="tile bg-grey">
        <svg viewBox="0 0 24 24">
          <rect x="9" y="9" width="6" height="1.6" rx="0.8" fill="#B9A8F0"/>
          <rect x="11.2" y="10.6" width="1.6" height="6" fill="#B9A8F0"/>
          <path d="M4 9l3-2 3 2-1 3H5z" fill="#7C6FE0"/>
          <path d="M14 9l3-2 3 2-1 3h-4z" fill="#7C6FE0"/>
        </svg>
      </div>
      <span class="tile-label">Furniture<br>guide</span>
    </a>

    <a class="tile-link" href="#">
      <div class="tile bg-grey">
        <svg viewBox="0 0 24 24">
          <rect x="5" y="4" width="14" height="16" rx="2" fill="#EFE9DA"/>
          <rect x="7.5" y="8" width="9" height="1.4" rx="0.7" fill="#E2645B"/>
          <rect x="7.5" y="11" width="9" height="1.4" rx="0.7" fill="#E8B84B"/>
          <rect x="7.5" y="14" width="6" height="1.4" rx="0.7" fill="#E8B84B"/>
        </svg>
      </div>
      <span class="tile-label">Promo<br>storyboard</span>
    </a>

    <a class="tile-link" href="#">
      <div class="tile bg-grey">
        <span class="logo-text" style="color:var(--cyan); font-style:italic;">
          <span class="l1" style="color:var(--cyan);">Conference</span>
          Logos
        </span>
      </div>
      <span class="tile-label">Conference<br>logos</span>
    </a>

  </div>

  <footer class="page-footer">
    <span>Kitco Media</span>
    <span>Conference</span>
  </footer>

</div>
</body>
</html>
