<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interviews — Kitco Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="lockup">
      <span class="kitco">KITCO</span>
      <span class="media-badge">MEDIA</span>
    </div>
    <div class="util-row">
      <a class="util-btn util-home" href="index.html" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2V20h-6v-6h-4v6H4Z" fill="#fff"/></svg>
      </a>
      <a class="util-btn util-help" href="help.html" aria-label="Help">?</a>
    </div>
  </div>

  <div class="page-head">
    <div class="page-icon bg-blue">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="7.2" r="3.4" fill="#fff"/><path d="M6 15.2c0-2.4 2.6-3.6 6-3.6s6 1.2 6 3.6v1.2H6Z" fill="#fff"/><rect x="4" y="17.4" width="16" height="2.4" rx="1" fill="#fff"/></svg>
    </div>
    <h1>Interviews</h1>
  </div>

  <div class="grid">

    <a class="tile-link" href="#">
      <div class="tile bg-black">
        <span class="mini-word">KITCO</span>
        <span class="mini-badge" style="background:#2F6FCE; top:54%;">NEWS</span>
        <span class="mini-check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-10" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <span class="tile-label">News<br>checklist</span>
    </a>

    <a class="tile-link" href="#">
      <div class="tile bg-black">
        <span class="mini-word">KITCO</span>
        <span class="mini-badge" style="background:var(--gold); top:54%;">MINING</span>
        <span class="mini-check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-10" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <span class="tile-label">Mining<br>checklist</span>
    </a>

    <a class="tile-link" href="#">
      <div class="tile bg-grey">
        <svg viewBox="0 0 24 24"><path d="M3 17l4-5 4 3 5-7 5 4v6H3z" fill="#8FD0F0"/><path d="M3 17h18" stroke="#fff" stroke-width="1"/></svg>
      </div>
      <span class="tile-label">Chart guide</span>
    </a>

    <a class="tile-link" href="#">
      <div class="tile bg-grey">
        <svg viewBox="0 0 24 24"><path d="M4 9l8-5 8 5-8 5z" fill="#fff"/><path d="M4 9v5l8 5 8-5V9l-8 5z" fill="#fff" opacity="0.55"/></svg>
        <span class="mini-badge" style="background:#2F6FCE; bottom:9%; top:auto;">NEWS</span>
      </div>
      <span class="tile-label">Dropbox<br>news</span>
    </a>

    <a class="tile-link" href="#">
      <div class="tile bg-coral">
        <svg viewBox="0 0 24 24">
          <rect x="2" y="8.6" width="16" height="6.8" rx="3.4" fill="#fff"/>
          <text x="10" y="13.4" font-size="4.6" font-weight="700" fill="#E2645B" text-anchor="middle" font-family="Inter, sans-serif">Booking</text>
          <circle cx="19" cy="17" r="1.3" fill="#fff"/>
          <circle cx="19" cy="17" r="3" fill="none" stroke="#fff" stroke-width="1" opacity="0.7"/>
        </svg>
      </div>
      <span class="tile-label">Booking</span>
    </a>

    <a class="tile-link" href="#">
      <div class="tile bg-black">
        <svg viewBox="0 0 24 24">
          <circle cx="6" cy="7" r="1.8" fill="#fff"/><rect x="9" y="6.2" width="10" height="1.6" rx="0.8" fill="#fff"/>
          <circle cx="6" cy="12" r="1.8" fill="#fff"/><rect x="9" y="11.2" width="10" height="1.6" rx="0.8" fill="#fff"/>
          <circle cx="6" cy="17" r="1.8" fill="#fff"/><rect x="9" y="16.2" width="10" height="1.6" rx="0.8" fill="#fff"/>
        </svg>
      </div>
      <span class="tile-label">Contacts /<br>archive</span>
    </a>

    <a class="tile-link" href="#">
      <div class="tile bg-grey">
        <svg viewBox="0 0 24 24">
          <defs><radialGradient id="ig1" cx="30%" cy="30%" r="80%"><stop offset="0" stop-color="#F5C24D"/><stop offset="0.5" stop-color="#E2445B"/><stop offset="1" stop-color="#8E3FAE"/></radialGradient></defs>
          <rect x="6" y="2" width="12" height="20" rx="3" fill="none" stroke="#fff" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="4" fill="url(#ig1)"/>
          <circle cx="12" cy="12" r="1.5" fill="#fff"/>
        </svg>
      </div>
      <span class="tile-label">Socials</span>
    </a>

    <a class="tile-link" href="#">
      <div class="tile bg-grey">
        <svg viewBox="0 0 24 24"><path d="M4 9l8-5 8 5-8 5z" fill="#fff"/><path d="M4 9v5l8 5 8-5V9l-8 5z" fill="#fff" opacity="0.55"/></svg>
        <span class="mini-badge" style="background:var(--gold); bottom:9%; top:auto;">MINING</span>
      </div>
      <span class="tile-label">Dropbox<br>mining</span>
    </a>

  </div>

  <footer class="page-footer">
    <span>Kitco Media</span>
    <span>Interviews</span>
  </footer>

</div>
</body>
</html>
