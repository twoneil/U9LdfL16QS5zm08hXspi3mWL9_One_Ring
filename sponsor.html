<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sponsor — Kitco Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="lockup">
      <span class="kitco">KITCO</span>
      <span class="media-badge">MEDIA</span>
    </div>
    <div class="util-row">
      <a class="util-btn util-home" href="index.html" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2V20h-6v-6h-4v6H4Z" fill="#fff"/></svg>
      </a>
      <a class="util-btn util-help" href="help.html" aria-label="Help">?</a>
    </div>
  </div>

  <div class="page-head">
    <div class="page-icon bg-purple">
      <svg viewBox="0 0 24 24">
        <path d="M13 6.2l7-3.2v14l-7-3.2z" fill="#E8B84B"/>
        <rect x="11.2" y="7" width="2.2" height="4.6" fill="#E8B84B"/>
        <circle cx="8.4" cy="15.2" r="5" fill="#3FCB6B"/>
        <text x="8.4" y="17.4" font-size="6.6" font-weight="700" fill="#fff" text-anchor="middle" font-family="Inter, sans-serif">$</text>
      </svg>
    </div>
    <h1>Sponsor</h1>
  </div>

  <div class="grid">

    <a class="tile-link" href="#">
      <div class="tile bg-grey">
        <span class="logo-text" style="color:var(--magenta); font-style:italic;">
          <span class="l1" style="color:var(--magenta);">Sponsor</span>
          Logos
        </span>
      </div>
      <span class="tile-label">Sponsor<br>logos</span>
    </a>

    <a class="tile-link" href="#">
      <div class="tile bg-grey">
        <svg viewBox="0 0 24 24">
          <rect x="5" y="3" width="12" height="17" rx="2" fill="none" stroke="#5AA9F5" stroke-width="1.5"/>
          <rect x="8.5" y="1.6" width="5" height="2.4" rx="1" fill="#5AA9F5"/>
          <path d="M7.5 8l1.3 1.3L11 7" stroke="#5AA9F5" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="12" y="7.4" width="3.5" height="1.2" rx="0.6" fill="#5AA9F5"/>
          <path d="M7.5 12.5l1.3 1.3 2.2-2.3" stroke="#5AA9F5" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="12" y="11.9" width="3.5" height="1.2" rx="0.6" fill="#5AA9F5"/>
          <circle cx="17" cy="18" r="4.2" fill="#3E77E0"/>
          <text x="17" y="19.6" font-size="5" font-weight="700" fill="#fff" text-anchor="middle" font-family="Inter, sans-serif">$</text>
        </svg>
      </div>
      <span class="tile-label">Guide —<br>daily shows</span>
    </a>

    <a class="tile-link" href="#">
      <div class="tile bg-beige">
        <svg viewBox="0 0 24 24">
          <rect x="4" y="4" width="16" height="16" rx="2" fill="#fff" stroke="#D8D2C4"/>
          <rect x="6" y="7" width="12" height="1.2" fill="#3A3A3D" opacity="0.45"/>
          <rect x="6" y="10" width="12" height="1.2" fill="#3A3A3D" opacity="0.45"/>
          <rect x="6" y="13" width="8" height="1.2" fill="#3A3A3D" opacity="0.45"/>
          <circle cx="17" cy="16.4" r="4" fill="none" stroke="#C99A3B" stroke-width="1.6"/>
          <text x="17" y="18" font-size="4.6" font-weight="700" fill="#C99A3B" text-anchor="middle" font-family="Inter, sans-serif">AD</text>
        </svg>
      </div>
      <span class="tile-label">Ad option<br>on video</span>
    </a>

    <div class="tile-link soon">
      <div class="tile bg-soon">
        <span style="font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:28px; color:#C7CBD3;">?</span>
      </div>
      <span class="tile-label">Soon</span>
    </div>

  </div>

  <footer class="page-footer">
    <span>Kitco Media</span>
    <span>Sponsor</span>
  </footer>

</div>
</body>
</html>
