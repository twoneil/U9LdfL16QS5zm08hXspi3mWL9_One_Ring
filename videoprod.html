<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Video production — Kitco Media</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="lockup">
      <span class="kitco">KITCO</span>
      <span class="media-badge">MEDIA</span>
    </div>
    <div class="util-row">
      <a class="util-btn util-home" href="index.html" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M4 11.2 12 4l8 7.2V20h-6v-6h-4v6H4Z" fill="#fff"/></svg>
      </a>
      <a class="util-btn util-help" href="help.html" aria-label="Help">?</a>
    </div>
  </div>

  <div class="page-head">
    <div class="page-icon bg-coral">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="3" width="14" height="14" rx="4" fill="#fff"/>
        <path d="M8 7.5v6l5-3z" fill="#E2645B"/>
        <path d="M16.2 14.2l5 5" stroke="#fff" stroke-width="2.3" stroke-linecap="round"/>
        <path d="M19.6 12.6l3 3-2 2-3-3z" fill="#fff"/>
      </svg>
    </div>
    <h1>Video production</h1>
  </div>

  <div class="grid">

    <a class="tile-link" href="#">
      <div class="tile bg-black">
        <svg viewBox="0 0 24 24">
          <rect x="5" y="3" width="14" height="18" rx="2" fill="#F3DE7B"/>
          <rect x="8" y="1.6" width="8" height="2.6" rx="1" fill="#C99A3B"/>
          <rect x="7.5" y="8" width="9" height="1" fill="#8a7530" opacity="0.55"/>
          <rect x="7.5" y="10.5" width="9" height="1" fill="#8a7530" opacity="0.55"/>
          <rect x="7.5" y="13" width="6" height="1" fill="#8a7530" opacity="0.55"/>
        </svg>
        <span class="mini-check"><svg viewBox="0 0 24 24"><path d="M5 13l4 4 10-10" stroke="#fff" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <span class="tile-label">Pre-prod<br>checklist</span>
    </a>

    <a class="tile-link" href="#">
      <div class="tile bg-grey">
        <svg viewBox="0 0 24 24">
          <rect x="5" y="3" width="14" height="18" rx="2" fill="#3E77E0"/>
          <path d="M15 3v4h4z" fill="#8FB4F0"/>
          <path d="M7.5 10l1.3 1.3 2-2.1" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="11.5" y="9.6" width="4.5" height="1" fill="#fff"/>
          <path d="M7.5 14l1.3 1.3 2-2.1" stroke="#fff" stroke-width="1.3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="11.5" y="13.6" width="4.5" height="1" fill="#fff"/>
        </svg>
      </div>
      <span class="tile-label">Postprod<br>checklist</span>
    </a>

    <a class="tile-link" href="#">
      <div class="tile bg-grey">
        <svg viewBox="0 0 24 24">
          <defs><linearGradient id="rg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3FE0A0"/><stop offset="1" stop-color="#34C7C7"/></linearGradient></defs>
          <circle cx="14" cy="5" r="2.2" fill="url(#rg1)"/>
          <path d="M9 20l3-6 2 1.5 1-4 4 1.5-1 3-3-1-1.5 3-2 3z" fill="url(#rg1)"/>
        </svg>
      </div>
      <span class="tile-label">Plan of<br>action</span>
    </a>

    <div class="tile-link soon">
      <div class="tile bg-soon">
        <svg viewBox="0 0 24 24"><path d="M3 17l4-4 4 2 5-6 5 3v5H3z" fill="#C9D6E3"/></svg>
      </div>
      <span class="tile-label">Soon</span>
    </div>

  </div>

  <footer class="page-footer">
    <span>Kitco Media</span>
    <span>Video production</span>
  </footer>

</div>
</body>
</html>
